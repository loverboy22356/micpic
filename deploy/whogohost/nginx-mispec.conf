# /etc/nginx/sites-available/mispec.conf
# Replace api.mispec.co.uk with the domain you point at the Whogohost VPS.
# Certbot (see README) will add the :443 server block for you.

upstream mispec_api {
    server 127.0.0.1:8000 fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.mispec.co.uk;

    # Profile photos / uploads through the API
    client_max_body_size 25M;

    access_log /var/log/nginx/mispec.access.log;
    error_log  /var/log/nginx/mispec.error.log;

    # Static files collected by `manage.py collectstatic`
    location /static/ {
        alias /home/mispec/app/static/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /home/mispec/app/media/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
        proxy_pass http://mispec_api;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
